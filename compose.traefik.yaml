# Traefik deployment: no port published, routed on the external `traefik` network.
# Requires a Traefik instance with a `websecure` entrypoint and `letsencrypt`
# resolver. Select with COMPOSE_FILE=compose.traefik.yaml in .env.

services:
  ocl-cache:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TRUST_PROXY: ${TRUST_PROXY:-}
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.oclcache.rule=Host(`ocl-cache.cheminfo.org`)'
      - 'traefik.http.routers.oclcache.entrypoints=websecure'
      - 'traefik.http.routers.oclcache.tls.certresolver=letsencrypt'
      - 'traefik.http.services.oclcache.loadbalancer.server.port=${PORT:-20822}'

  process-sdf:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 4g
    cpus: 4
    pids_limit: 1024
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TRUST_PROXY: ${TRUST_PROXY:-}
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    command: ['npm', 'run', 'processSDF']

networks:
  traefik:
    external: true
