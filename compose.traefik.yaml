# Traefik deployment: no port published, routed on the external `traefik` network.
# Requires a Traefik instance with a `websecure` entrypoint and `letsencrypt`
# resolver. Select with COMPOSE_FILE=compose.traefik.yaml in .env.

services:
  ocl-cache:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 16g
    cpus: 6
    pids_limit: 512
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
      SITE_URL: ${SITE_URL:-}
      STATS_INTERVAL: ${STATS_INTERVAL:-}
      WORKER_THREADS: ${WORKER_THREADS:-}
      STATS_FULL_INTERVAL: ${STATS_FULL_INTERVAL:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.PORT || 20822) + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.oclcache.rule=Host(`ocl-cache.cheminfo.org`)'
      - 'traefik.http.routers.oclcache.entrypoints=websecure'
      - 'traefik.http.routers.oclcache.tls.certresolver=letsencrypt'
      - 'traefik.http.services.oclcache.loadbalancer.server.port=${PORT:-20822}'

  process-sdf:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 16g
    cpus: 4
    pids_limit: 1024
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
      SITE_URL: ${SITE_URL:-}
      STATS_INTERVAL: ${STATS_INTERVAL:-}
      WORKER_THREADS: ${WORKER_THREADS:-}
      STATS_FULL_INTERVAL: ${STATS_FULL_INTERVAL:-}
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'node']
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ['npm', 'run', 'processSDF']

  # The statistics pass: a full scan of `molecules`, which has no business in
  # the server's process. It writes the rollup the /v1/stats route reads.
  refresh-stats:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 8g
    cpus: 1
    pids_limit: 256
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
      SITE_URL: ${SITE_URL:-}
      STATS_INTERVAL: ${STATS_INTERVAL:-}
      WORKER_THREADS: ${WORKER_THREADS:-}
      STATS_FULL_INTERVAL: ${STATS_FULL_INTERVAL:-}
      # The full pass sorts every id in the table; it spills to the data volume
      # rather than to memory or to the tmpfs. See docker-entrypoint.sh.
      SQLITE_TMPDIR: ${DATA_DIR:-/app/data}/tmp
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'node']
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ['node', 'src/scripts/refreshStats.ts']

  # Keeps the search index in step with the cache: it adds every molecule the
  # index does not hold yet, then hashes them. The index is a database of its
  # own (data/sqlite/search.sqlite), so nothing here writes to the cache and the
  # index can be deleted and rebuilt without touching 150 million rows.
  #
  # The fingerprint is read out of the cache rather than recomputed — 88 us a
  # molecule against 1350 — which is the whole reason openchemlib-sqlite's
  # insert() takes a precomputed entry.
  index-molecules:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 8g
    cpus: 2
    pids_limit: 256
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      WORKER_THREADS: ${WORKER_THREADS:-}
      INDEX_LIMIT: ${INDEX_LIMIT:-}
      INDEX_INTERVAL: ${INDEX_INTERVAL:-}
      INDEX_IDLE_INTERVAL: ${INDEX_IDLE_INTERVAL:-}
      INDEX_HASHES: ${INDEX_HASHES:-}
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'node']
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ['node', 'src/scripts/indexMolecules.ts']

networks:
  traefik:
    external: true
