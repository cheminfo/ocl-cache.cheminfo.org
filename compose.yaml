# Port-published deployment: PORT is exposed on the host loopback.
# Selected by default when COMPOSE_FILE is unset in .env.

services:
  ocl-cache:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 16g
    cpus: 6
    pids_limit: 512
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
      SITE_URL: ${SITE_URL:-}
      STATS_INTERVAL: ${STATS_INTERVAL:-}
      WORKER_THREADS: ${WORKER_THREADS:-}
      STATS_FULL_INTERVAL: ${STATS_FULL_INTERVAL:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + (process.env.PORT || 20822) + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    ports:
      - 127.0.0.1:${PORT:-20822}:${PORT:-20822}

  process-sdf:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 16g
    cpus: 4
    pids_limit: 1024
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
      SITE_URL: ${SITE_URL:-}
      STATS_INTERVAL: ${STATS_INTERVAL:-}
      WORKER_THREADS: ${WORKER_THREADS:-}
      STATS_FULL_INTERVAL: ${STATS_FULL_INTERVAL:-}
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'node']
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ['npm', 'run', 'processSDF']

  # The statistics pass: a full scan of `molecules`, which has no business in
  # the server's process. It writes the rollup the /v1/stats route reads.
  refresh-stats:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/ocl-cache.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 8g
    cpus: 1
    pids_limit: 256
    environment:
      NODE_ENV: production
      PORT: ${PORT:-20822}
      DATA_DIR: ${DATA_DIR:-/app/data}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
      SITE_URL: ${SITE_URL:-}
      STATS_INTERVAL: ${STATS_INTERVAL:-}
      WORKER_THREADS: ${WORKER_THREADS:-}
      STATS_FULL_INTERVAL: ${STATS_FULL_INTERVAL:-}
      # The full pass sorts every id in the table; it spills to the data volume
      # rather than to memory or to the tmpfs. See docker-entrypoint.sh.
      SQLITE_TMPDIR: ${DATA_DIR:-/app/data}/tmp
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'node']
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    command: ['node', 'src/scripts/refreshStats.ts']
